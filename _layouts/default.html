<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/images/branding/dt-lab-icon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/branding/dt-lab-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if site.visitor_map_enabled and page.url == '/' %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="{{ '/assets/js/visitor-map.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    {% endif %}
    {% seo %}
    <meta property="og:image" content="{{ '/assets/images/branding/social-preview.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Data Transpose Lab — Trustworthy AI and Data Systems">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ '/assets/images/branding/social-preview.png' | absolute_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
          <img class="brand-logo" src="{{ '/assets/images/branding/DT_Lab_geometric_logo_web.svg' | relative_url }}" alt="Data Transpose Lab">
        </a>
        <div class="nav-links">
          <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
          <a href="{{ '/people/' | relative_url }}"{% if page.url == '/people/' %} aria-current="page"{% endif %}>People</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
        </div>
      </nav>
    </header>

    <main class="container" id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p><strong>{{ site.title }}</strong><br>{{ site.description }}</p>
        <p>&copy; {{ 'now' | date: '%Y' }} · Hosted on GitHub Pages</p>
      </div>
    </footer>
  </body>
</html>
